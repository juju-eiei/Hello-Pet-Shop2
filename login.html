<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - Hello Pet Shop</title>
    <!-- Direct stylesheet link to eliminate FOUC / flickering -->
    <link rel="stylesheet" href="/src/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script type="module" src="/src/js/main.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', 'Kanit', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="bg-gradient-to-br from-primary-50 to-primary-100 min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="flex items-center justify-between px-4 sm:px-8 py-4 sm:py-6">
        <div class="flex items-center space-x-2 text-primary-600 flex-shrink-0">
            <div class="w-8 h-8 sm:w-10 sm:h-10 bg-secondary-600 rounded-xl flex items-center justify-center text-white shadow-lg">
                <i class="fas fa-paw text-lg sm:text-xl"></i>
            </div>
            <span class="text-lg sm:text-2xl font-bold tracking-tight text-gray-800 whitespace-nowrap hidden sm:inline-block">Hello Pet Shop</span>
            <span class="text-xl font-bold tracking-tight text-gray-800 whitespace-nowrap sm:hidden">Pet Shop</span>
        </div>
        <div class="flex items-center space-x-3 sm:space-x-6">
            <a href="/products" class="text-sm sm:text-base text-gray-600 hover:text-primary-600 font-medium transition-colors whitespace-nowrap">สินค้า</a>
            <a href="/register" class="whitespace-nowrap text-sm sm:text-base px-4 py-2 sm:px-5 sm:py-2.5 bg-secondary-600 text-white rounded-lg font-semibold shadow-md hover:shadow-lg hover:bg-secondary-700 transition-all">สมัครสมาชิก</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center px-4 py-8 sm:py-12">
        <div class="glass w-full max-w-md p-6 sm:p-8 rounded-2xl sm:rounded-3xl shadow-2xl space-y-6 sm:space-y-8">
            <div class="text-center space-y-2">
                <h2 class="text-2xl sm:text-3xl font-bold text-gray-900">ยินดีต้อนรับกลับมา</h2>
                <p class="text-gray-500 text-sm sm:text-base">เข้าสู่ระบบเพื่อจัดการร้านค้าสัตว์เลี้ยงของคุณ</p>
            </div>

            <form id="loginForm" class="space-y-6">
                <div class="space-y-2">
                    <label class="text-sm font-semibold text-gray-700 ml-1">ชื่อผู้ใช้</label>
                    <div class="relative">
                        <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" name="username" placeholder="กรอกชื่อผู้ใช้ของคุณ" required
                            class="w-full pl-11 pr-4 py-3.5 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none transition-all shadow-sm">
                    </div>
                </div>

                <div class="space-y-2">
                    <div class="flex justify-between items-center ml-1">
                        <label class="text-sm font-semibold text-gray-700">รหัสผ่าน</label>
                        <a href="/forgot-password" class="text-xs font-semibold text-primary-600 hover:text-primary-700 hover:underline">ลืมรหัสผ่าน?</a>
                    </div>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="password" name="password" placeholder="กรอกรหัสผ่านของคุณ" required
                            class="w-full pl-11 pr-4 py-3.5 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none transition-all shadow-sm">
                    </div>
                </div>

                <button type="submit" class="w-full py-4 bg-secondary-600 text-white rounded-xl font-bold shadow-lg hover:shadow-secondary-200 hover:bg-secondary-700 active:scale-[0.98] transition-all flex items-center justify-center space-x-2">
                    <span>เข้าสู่ระบบ</span>
                    <i class="fas fa-arrow-right text-sm"></i>
                </button>

                <div class="text-center pt-2">
                    <a href="/register" class="text-gray-500 hover:text-primary-600 transition-colors text-sm">
                        ยังไม่มีบัญชีใช่หรือไม่? <span class="text-primary-600 font-semibold underline underline-offset-4">สมัครสมาชิก</span>
                    </a>
                </div>
            </form>
        </div>
    </main>

    <!-- Toast Component (Simplified for now) -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 px-6 py-3 rounded-xl shadow-xl transition-all duration-500 opacity-0 translate-y-4 pointer-events-none z-50"></div>

    <script type="module">
        import { showToast } from '/src/js/utils.js';

        // Remove auto-login to force users to login manually
        // If they want to logout or login as someone else, they can do so safely.
        localStorage.removeItem('user');
        localStorage.removeItem('productsMenuOpen');
        localStorage.removeItem('staffProductsMenuOpen');

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            console.log('Login form submitted!');
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            console.log('Login Request Data:', data);

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                
                if (response.ok && result && (result.data || result.user_id)) {
                    showToast("เข้าสู่ระบบสำเร็จ! กำลังเปลี่ยนเส้นทาง...", "success");
                    
                    const loggedInUser = result.data || result;
                    const userId = loggedInUser.user_id ? String(loggedInUser.user_id) : String(loggedInUser.username || 'default');

                    // Clear previous user's global session caches
                    try {
                        localStorage.removeItem('userProfileData');
                        localStorage.removeItem('myOrders');
                        localStorage.removeItem('myPetsData');
                        localStorage.removeItem('savedAccountProfiles');
                    } catch(e) {}

                    localStorage.setItem('user', JSON.stringify(loggedInUser));

                    // Sync initial profile state in localStorage so getUserProfileData has name, phone, email
                    try {
                        const userKey = `userProfileData_${userId}`;
                        const displayNameVal = loggedInUser.first_name ? (loggedInUser.first_name + (loggedInUser.last_name ? ' ' + loggedInUser.last_name : '')) : (loggedInUser.username || '');
                        localStorage.setItem(userKey, JSON.stringify({
                            name: displayNameVal,
                            phone: loggedInUser.phone || '',
                            email: loggedInUser.email || '',
                            address: loggedInUser.address || '',
                            province: loggedInUser.province || '',
                            zipcode: loggedInUser.zipcode || '',
                            profileImage: loggedInUser.profile_image || loggedInUser.profileImage || ''
                        }));
                    } catch(e) {}

                    // Restore cart strictly for this account
                    try {
                        const savedCarts = JSON.parse(localStorage.getItem('savedUserCarts') || '{}');
                        const userCart = savedCarts[userId] || (loggedInUser.username ? savedCarts[loggedInUser.username] : []);
                        localStorage.setItem('cart', JSON.stringify(userCart || []));
                    } catch(e) {}

                    // Restore orders cache for this account if available
                    try {
                        const userOrdersStr = localStorage.getItem(`myOrders_${userId}`);
                        if (userOrdersStr) {
                            localStorage.setItem('myOrders', userOrdersStr);
                        } else {
                            localStorage.removeItem('myOrders');
                        }
                    } catch(e) {}
                    
                    setTimeout(() => {
                        const role = (loggedInUser && loggedInUser.role_name) ? String(loggedInUser.role_name).toLowerCase() : 'customer';
                        if (role === 'admin') {
                            window.location.href = '/admin/orders';
                        } else if (role === 'customer') {
                            window.location.href = '/products';
                        } else {
                            window.location.href = '/staff/orders';
                        }
                    }, 1000);
                } else {
                    showToast((result && result.message) ? result.message : "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง", "error");
                }
            } catch (error) {
                console.error("Login submission error:", error);
                showToast("ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง", "error");
            }
        });
    </script>
</body>
</html>
